---
name: Template Release

"on":
  push:
    tags:
      - "wasp-v*-template"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., wasp-v0.18-template)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      tag_name: ${{ inputs.tag || github.ref_name }}
      archive_name: template.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.tag_name}}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Create template archive
        run: make release-check VERSION="$tag_name" ARCHIVE="$archive_name"

      - name: Create release if it doesn't exist
        run: |
          if ! gh release view "$tag_name"; then
            gh release create "$tag_name"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: gh release upload "$tag_name" "$archive_name" "$archive_name.sha256" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
